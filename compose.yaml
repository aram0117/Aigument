version: '3.8'

# ==============================================================================
# Aigument Infrastructure Configuration
# ==============================================================================
# 구조:
# 1. Routing Layer     : Nginx (Reverse Proxy & SSL Termination)
# 2. Application Layer : Spring Boot Backend
# 3. AI Layer          : Ollama Server & Model Initializer
# 4. Data Layer        : MySQL (RDBMS) & Redis (In-Memory Data Store)
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # 1. Routing Layer
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine # 경량화 및 보안을 위해 alpine 버전 명시
    container_name: aigument-nginx
    restart: unless-stopped # 예상치 못한 종료 시 자동 재시작 (수동 종료 시 제외)
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/aigument_sever_ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - aigument-network

  # ----------------------------------------------------------------------------
  # 2. Application Layer
  # ----------------------------------------------------------------------------
  app:
    build: .
    container_name: aigument-app
    restart: unless-stopped
    # 주의: Nginx를 통해서만 트래픽을 받으려면 배포 시 8080 포트 바인딩을 제거하여
    # Host OS를 통한 직접 접근을 차단하는 것이 안전합니다. (현재는 로컬 디버깅용으로 유지)
    ports:
      - "8080:8080"
    environment:
      # [Database Configuration]
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/aigument_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: true

      # [Redis Configuration]
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # [AI Engine Configuration]
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      AI_ENGINE_URL: ${AI_ENGINE_URL}

      # [Security & OAuth2]
      JWT_SECRET: ${JWT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      COOKIE_SECURE: false # TODO: 운영 환경 배포 시 true로 변경하여 HTTPS 전용 쿠키로 설정

      # [External APIs & App Properties]
      MAIN_PAGE_URL: ${MAIN_PAGE_URL}
      SEVER_URL: ${SEVER_URL}
      SOLAPI_KEY: ${SOLAPI_KEY}
      SOLAPI_SECRET: ${SOLAPI_SECRET}
      SOLAPI_SENDER_PHONENUMBER: ${SOLAPI_SENDER_PHONENUMBER}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    networks:
      - aigument-network

  # ----------------------------------------------------------------------------
  # 3. AI Layer
  # ----------------------------------------------------------------------------
  ai-engine:
    image: ollama/ollama:latest
    container_name: aigument-ai
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - aigument-network
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-engine-init:
    image: ollama/ollama:latest
    container_name: aigument-ai-init
    # 이 컨테이너는 1회성 작업(Job)이므로 restart 정책을 적용하지 않음
    depends_on:
      ai-engine:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ai-engine:11434
    networks:
      - aigument-network
    entrypoint: >
      sh -c "echo '[Init] Pulling Llama3 model...' && 
             ollama pull llama3 && 
             echo '[Init] Model pull complete!'"

  # ----------------------------------------------------------------------------
  # 4. Data Layer
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: aigument-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: aigument_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - aigument-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine # 안정적인 캐싱을 위해 구체적인 alpine 버전 명시
    container_name: aigument-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data # Redis 데이터 영속성을 위한 볼륨 마운트 추가
    networks:
      - aigument-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  aigument-network:
    driver: bridge