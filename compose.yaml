version: '3.8'

services:
  # 1. Reverse Proxy (Nginx)
  nginx:
    image: nginx:latest
    container_name: aigument-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - aigument-network

  # 2. Spring Boot App (위에 만든 Dockerfile 사용)
  app:
    build: .
    container_name: aigument-app
    environment:
      # 도커 네트워크 안에서는 서비스 이름(db, redis)이 호스트 주소가 됨
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/aigument_db?serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      AI_ENGINE_URL: http://ai-engine:8000
    depends_on:
      - db
      - redis
    networks:
      - aigument-network

  # 3. AI Engine (Ollama)
  ai-engine:
    image: ollama/ollama:latest
    container_name: aigument-ai
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - aigument-network

  # 4. Database (MySQL)
  db:
    image: mysql:8.0
    container_name: aigument-db
    environment:
      MYSQL_DATABASE: aigument_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - aigument-network

  # 5. Redis
  redis:
    image: redis:latest
    container_name: aigument-redis
    command: redis-server --appendonly yes
    networks:
      - aigument-network

networks:
  aigument-network:
    driver: bridge