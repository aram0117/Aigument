# ==============================================================================
# Aigument Infrastructure Configuration
# ==============================================================================
# 구조:
# 1. Routing Layer     : Nginx (Reverse Proxy & SSL Termination)
# 2. Application Layer : Spring Boot Backend
# 3. AI Layer          : Ollama Server & Model Initializer
# 4. Data Layer        : MySQL (RDBMS) & Redis (In-Memory Data Store)
# 5. Monitoring Layer  : Prometheus (메트릭) & Loki (로그) & Grafana (대시보드)
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # 1. Routing Layer
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine # 경량화 및 보안을 위해 alpine 버전 명시
    container_name: aigument-nginx
    restart: unless-stopped # 예상치 못한 종료 시 자동 재시작 (수동 종료 시 제외)
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/aigument_sever_ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - aigument-network

  # ----------------------------------------------------------------------------
  # 2. Application Layer
  # ----------------------------------------------------------------------------
  app:
    build: .
    container_name: aigument-app
    restart: unless-stopped
    # 주의: 운영 배포 시 8080 포트 바인딩을 제거해 Nginx를 통해서만 트래픽을 받도록 해야 안전함 (현재는 로컬 디버깅용으로 유지)
    ports:
      - "8080:8080"
    environment:
      # [Database Configuration]
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/aigument_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-true}
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:-true}

      # [Redis Configuration]
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_CHAT_LOG_TTL_HOURS: ${REDIS_CHAT_LOG_TTL_HOURS:-1} # 채팅 로그 Redis 보관 시간

      # [AI Engine Configuration]
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-judge-llama3}
      AI_MODEL_TTL: ${AI_MODEL_TTL:-3} # Ollama 응답 타임아웃 (분)
      AI_MODEL_KEEP_ALIVE: ${AI_MODEL_KEEP_ALIVE:-1h} # Ollama 모델 메모리 유지 시간

      # [JWT & Token]
      JWT_SECRET: ${JWT_SECRET}
      JWT_CLOCK_SKEW_SECONDS: ${JWT_CLOCK_SKEW_SECONDS:-60} # 서버 간 시간 오차 허용 범위
      JWT_ACCESS_TOKEN_TTL_MS: ${JWT_ACCESS_TOKEN_TTL_MS:-1800000} # 30분
      JWT_REFRESH_TOKEN_TTL_MS: ${JWT_REFRESH_TOKEN_TTL_MS:-1209600000} # 14일

      # [Security & OAuth2]
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      OAUTH2_COOKIE_EXPIRE_SECONDS: ${OAUTH2_COOKIE_EXPIRE_SECONDS:-180} # 소셜 로그인 중간 쿠키 유효시간
      COOKIE_SECURE: ${COOKIE_SECURE:-false} # TODO: 운영 환경 배포 시 true로 변경하여 HTTPS 전용 쿠키로 설정

      # [SMS Authentication]
      SOLAPI_KEY: ${SOLAPI_KEY}
      SOLAPI_SECRET: ${SOLAPI_SECRET}
      SOLAPI_SENDER_PHONENUMBER: ${SOLAPI_SENDER_PHONENUMBER}
      SMS_AUTH_CODE_TTL_MINUTES: ${SMS_AUTH_CODE_TTL_MINUTES:-3}

      # [Async Thread Pool - 채팅방]
      ASYNC_CHAT_ROOM_CORE_POOL_SIZE: ${ASYNC_CHAT_ROOM_CORE_POOL_SIZE:-10}
      ASYNC_CHAT_ROOM_MAX_POOL_SIZE: ${ASYNC_CHAT_ROOM_MAX_POOL_SIZE:-20}
      ASYNC_CHAT_ROOM_QUEUE_CAPACITY: ${ASYNC_CHAT_ROOM_QUEUE_CAPACITY:-500}

      # [WebSocket Heartbeat]
      WEBSOCKET_HEARTBEAT_CLIENT_INTERVAL_MS: ${WEBSOCKET_HEARTBEAT_CLIENT_INTERVAL_MS:-10000}
      WEBSOCKET_HEARTBEAT_SERVER_INTERVAL_MS: ${WEBSOCKET_HEARTBEAT_SERVER_INTERVAL_MS:-20000}
      WEBSOCKET_HEARTBEAT_SCHEDULER_POOL_SIZE: ${WEBSOCKET_HEARTBEAT_SCHEDULER_POOL_SIZE:-1}

      # [External APIs & App Properties]
      MAIN_PAGE_URL: ${MAIN_PAGE_URL}
      SERVER_URL: ${SERVER_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    networks:
      - aigument-network

  # ----------------------------------------------------------------------------
  # 3. AI Layer
  # ----------------------------------------------------------------------------
  ai-engine:
    image: ollama/ollama:latest
    container_name: aigument-ai
    restart: unless-stopped
    expose:
      - "11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    # 미리 로컬에 받아둔 ollama model 파일 복사
    volumes:
      - ./ollama/model:/root/.ollama
      - ./ollama/Modelfile:/Modelfile
    # GPU 자원 할당
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - aigument-network
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. Data Layer
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: aigument-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: aigument_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - aigument-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine # 안정적인 캐싱을 위해 구체적인 alpine 버전 명시
    container_name: aigument-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data # Redis 데이터 영속성을 위한 볼륨 마운트 추가
    networks:
      - aigument-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 5. Monitoring Layer
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: aigument-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090" # 로컬 디버깅용 (운영 배포 시 제거 권장)
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - aigument-network

  loki:
    image: grafana/loki:3.7.3
    container_name: aigument-loki
    restart: unless-stopped
    ports:
      - "3100:3100" # 로컬 디버깅용 (운영 배포 시 제거 권장)
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - aigument-network

  grafana:
    image: grafana/grafana:13.1.0
    container_name: aigument-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - aigument-network

networks:
  aigument-network:
    driver: bridge

volumes:
  prometheus_data:
  loki_data:
  grafana_data: