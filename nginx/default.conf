server {
    listen 80;
    server_name localhost;

    server_tokens off;

    # 공통 프록시 헤더 설정 (중복 제거용)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. 백엔드 API 요청
    location /api/ {
        proxy_pass http://app:8080;
    }

    # 2. OAuth2 소셜 로그인 요청
    location /oauth2/ {
        proxy_pass http://app:8080;
        # OAuth2의 경우 Redirect URI 처리를 위해 Host 헤더가 특히 중요합니다.
    }

    # 3. WebSocket STOMP 요청
    location /ws-stomp/ {
        proxy_pass http://app:8080;

        # WebSocket 필수 설정
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # 또는 위에서 언급한 map 변수 사용

        # 실시간성 확보를 위한 설정 (작성하신 내용 포함)
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off; # 요청 시에도 버퍼링을 꺼서 지연 감소
        chunked_transfer_encoding on;

        # 타임아웃 설정 (연결 유지 시간)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 연결이 끊겼을 때 빠르게 감지하기 위한 설정
        tcp_nodelay on;
   }
}