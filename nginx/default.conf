server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;

    server_tokens off;

    # Docker 내장 DNS(127.0.0.11)로 매 요청마다 재조회.
    # proxy_pass에 변수를 써야 nginx가 부팅 시점에 IP를 캐시하지 않고 이 resolver로 매번 재조회한다.
    # (app 컨테이너가 재배포되어 내부 IP가 바뀌어도 nginx를 재시작할 필요 없이 자동으로 새 IP를 따라간다 -
    # 이게 설정되어 있지 않아 재배포 직후 502 Connection refused가 발생했었다)
    resolver 127.0.0.11 valid=10s;
    set $app_upstream app:8080;

    # 테스트 용 html 경로 (시작 경로)
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ =404;
    }

    # 공통 프록시 헤더 설정
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;


    # 1. 백엔드 API 요청
    location /api/ {
        proxy_pass http://$app_upstream;
    }

    # 2. OAuth2 소셜 로그인 (Spring Security 기본 진입점 /oauth2/authorization/{provider})
    location /oauth2/ {
        proxy_pass http://$app_upstream;
    }

    # 3. WebSocket STOMP 요청
    location /ws-stomp/ {
        proxy_pass http://$app_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        tcp_nodelay on;
   }
}

# 80번(HTTP)으로 오면 443(HTTPS)으로 토스!
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}