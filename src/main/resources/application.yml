spring:
  application:
    name: aigument

# 모니터링 (Prometheus)
# 시크릿이 아닌 구조적 설정이므로 .env가 아닌 이 파일에 직접 명시한다.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

# 모니터링 (Loki 로그 전송 대상 - 로컬 실행 시 loki 컨테이너가 없으면 전송만 실패하고 앱은 정상 동작한다)
loki:
  url: ${LOKI_URL:http://loki:3100/loki/api/v1/push}
